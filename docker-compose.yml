name: mobead-lab

services:
  jenkins:
    build: ./infra/jenkins
    container_name: mobead-jenkins
    user: root  # Apenas laboratorio local: acesso ao socket Docker do host.
    ports:
      - '8080:8080'
    volumes:
      - jenkins_home:/var/jenkins_home
      - mobead_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_local_apenas_laboratorio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 10s
      retries: 12
    networks:
      - cicd
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: mobead-sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_local_apenas_laboratorio
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - cicd
    restart: unless-stopped

networks:
  cicd:
    name: mobead_cicd

volumes:
  jenkins_home:
    name: mobead_jenkins_home
  mobead_workspace:
    name: mobead_workspace
  postgres_data:
    name: mobead_postgres_data
  sonarqube_data:
    name: mobead_sonarqube_data
  sonarqube_extensions:
    name: mobead_sonarqube_extensions
